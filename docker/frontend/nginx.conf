worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # A full database backup/restore payload can exceed a few tens of MB (see
    # server/src/index.ts's express.json 200mb limit) — nginx's 1mb default would
    # otherwise reject it before it reaches the backend.
    client_max_body_size 200m;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://backend:4000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://backend:4000/uploads/;
        }

        # React Router: let the SPA handle unknown paths client-side.
        location / {
            try_files $uri /index.html;
        }
    }
}
