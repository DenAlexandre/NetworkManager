; Dropped into /etc/supervisor/conf.d/ — the apt-installed supervisord.conf
; already includes this directory and provides the [supervisord]/[unix_http_server]
; sections, so this file only needs to declare the three processes that make up
; the all-in-one container.

[program:postgres]
command=/app/docker/start-postgres.sh
user=postgres
priority=1
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/app/docker/start-backend.sh
directory=/app/server
priority=2
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
