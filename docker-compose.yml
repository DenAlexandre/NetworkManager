# 3-container deployment: postgres, backend (API) and frontend (nginx +
# built client), one service each. Independent of the day-to-day dev workflow
# (scripts/start-db.ps1 + run-dev.ps1 + the "networkmanager-db" container),
# which is unaffected by this file.
#
# Quick start:
#   cp .env.example .env      # edit JWT_SECRET / SEED_ADMIN_PASSWORD / etc.
#   docker compose up -d --build
#   -> http://localhost:8080
#
# Or use ./scripts/run-docker.ps1, which does the above (and can recreate it).
#
# If the build fails on `npm ci` with a certificate error, see
# docker/certs/README.md (common behind an SSL-inspecting corporate proxy).

services:
  postgres:
    image: postgres:16-alpine
    container_name: networkmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-networkmanager}
    volumes:
      - networkmanager-pgdata:/var/lib/postgresql/data
      # Only runs once, when the data directory is empty (fresh volume): loads a
      # snapshot of this project's schema + reference data + rights setup
      # (roles/permissions, admin + demo accounts) so a new deployment starts
      # from the same state instead of an empty database. See
      # docker/postgres-init/README.md to refresh this snapshot.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it, pg_isready defaults to the
      # unix socket, which postgres accepts on briefly during first-init (while
      # running docker/postgres-init/*.sql) before it restarts to listen on TCP
      # — reporting "healthy" too early and racing the backend's first
      # migration attempt (ECONNREFUSED).
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: networkmanager-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-networkmanager}
      JWT_SECRET: ${JWT_SECRET:?Definissez JWT_SECRET dans .env (voir .env.example)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-Admin}
      SEED_ADMIN_FIRST_NAME: ${SEED_ADMIN_FIRST_NAME:-Admin}
      SEED_ADMIN_LAST_NAME: ${SEED_ADMIN_LAST_NAME:-Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:-0000000000}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Definissez SEED_ADMIN_PASSWORD dans .env (voir .env.example)}
    volumes:
      - networkmanager-uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: networkmanager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  networkmanager-pgdata:
    name: networkmanager-pgdata
  networkmanager-uploads:
    name: networkmanager-uploads
